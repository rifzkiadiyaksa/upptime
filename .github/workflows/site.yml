# Custom frontend workflow; see frontend/README.md before updating Upptime templates.
name: Rifzki Status CI
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "package*.json"
      - ".github/workflows/site.yml"
      - ".upptimerc.yml"
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [static_site]
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "package*.json"
      - ".github/workflows/site.yml"
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  workflow_run:
    workflows: ["Uptime CI", "Summary CI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-rifzki-frontend
  cancel-in-progress: false
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}
          RADAR_API_TOKEN: ${{ secrets.RADAR_API_TOKEN }}
          INTELLIGENCE_PROXY_URL: ${{ vars.INTELLIGENCE_PROXY_URL }}
          SSL_ASSESSMENT_URL: ${{ vars.SSL_ASSESSMENT_URL }}
          SSL_ASSESSMENT_TOKEN: ${{ secrets.SSL_ASSESSMENT_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          github_token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          publish_dir: "dist"
          force_orphan: "false"
          user_name: "Rifzki Status"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
